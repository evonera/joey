# Single web host using an existing managed Postgres database (for example Neon).
# Keep DATABASE_URL and all secrets in the protected runtime env file, never build args.
services:
  app:
    image: joey-web:${JOEY_IMAGE_TAG:-local}
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set the public HTTPS origin}
        EVE_NEXT_PRODUCTION_PORT: ${EVE_NEXT_PRODUCTION_PORT:-4274}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
        NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN: ${NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN:-}
    env_file:
      - ${JOEY_ENV_FILE:?Set the absolute path to the protected runtime env file}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      EVE_NEXT_PRODUCTION_PORT: ${EVE_NEXT_PRODUCTION_PORT:-4274}
    ports:
      - "127.0.0.1:${JOEY_PORT:-3000}:3000"
    volumes:
      - joey_eve_data:/app/.eve
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Run explicitly after a database backup, before starting the new web image.
  # It is excluded from ordinary `up`, so a restart cannot silently run migrations.
  migrate:
    profiles: [migration]
    image: joey-migrate:${JOEY_IMAGE_TAG:-local}
    build:
      context: .
      target: migrator
    env_file:
      - ${JOEY_ENV_FILE:?Set the absolute path to the protected runtime env file}
    environment:
      NODE_ENV: production

volumes:
  joey_eve_data:
