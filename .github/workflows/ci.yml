name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application quality
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate migrations
        run: npm run check:migrations
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint:ci
      - name: Knip (dead code & dependency hygiene)
        run: npm run knip
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build web application
        run: npm run build
      - name: Build Eve runtime
        run: npm run build:eve

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: joey
          POSTGRES_PASSWORD: joey_password
          POSTGRES_DB: joey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://joey:joey_password@localhost:5432/joey_test
      BETTER_AUTH_SECRET: 864875f0003027faaf83ef3e30eac56f006ef975238a4c6a4c08fbfbc9c61754
      ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN: WEBMCP_ORIGIN_TRIAL_DUMMY_TOKEN_FOR_E2E
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Run Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  desktop:
    name: Tauri quality
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.7.7
        with:
          workspaces: src-tauri
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
