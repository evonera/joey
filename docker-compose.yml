services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        EVE_NEXT_PRODUCTION_PORT: ${EVE_NEXT_PRODUCTION_PORT:-4274}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
        NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN: ${NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN:-}
    env_file:
      - ${JOEY_ENV_FILE:-.env}
    ports:
      - "${JOEY_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${JOEY_DATABASE_URL:?Set JOEY_DATABASE_URL in .env to the URL-encoded internal db connection string}
      NODE_ENV: production
    volumes:
      - joey_eve_data:/app/.eve
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - joey_network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - ${JOEY_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${JOEY_DATABASE_URL:?Set JOEY_DATABASE_URL in .env to the URL-encoded internal db connection string}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - joey_network

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-joey}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - joey_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - joey_network

networks:
  joey_network:

volumes:
  joey_postgres_data:
  joey_eve_data:
