version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - NODE_ENV=production
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - joey_network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: npx drizzle-kit push
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_PROVIDER=postgres
    depends_on:
      db:
        condition: service_healthy
    networks:
      - joey_network

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-joey}
    ports:
      - "5432:5432"
    volumes:
      - joey_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d joey"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - joey_network

networks:
  joey_network:

volumes:
  joey_postgres_data:
